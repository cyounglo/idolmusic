<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>榜样音乐 IdolMusic · 榜单</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="images/logo.svg" alt="榜样音乐">
      <div>
        <div class="name">榜样音乐</div>
        <div class="en">IDOLMUSIC</div>
      </div>
    </div>
    <nav class="links">
      <a href="admin/">运营后台</a>
    </nav>
  </header>

  <section class="hero">
    <h1>榜样音乐排行榜</h1>
    <p class="slogan">听见榜样的力量</p>
  </section>

  <div class="period-bar">
    <label for="periodSelect">选择期数</label>
    <select id="periodSelect"></select>
    <span class="date" id="periodDate"></span>
  </div>

  <main class="chart-wrap" id="chart"></main>

  <footer class="site-footer">© 2026 榜样音乐 IdolMusic · 纯静态演示站点</footer>

  <script src="js/store.js"></script>
  <script src="js/main.js"></script>

</html>
