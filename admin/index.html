<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>榜样音乐 · 运营后台</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="left">
      <img src="../images/logo.svg" alt="榜样音乐">
      <h1>榜单运营后台</h1>
    </div>
    <div class="right">
      <a class="back" href="../">← 返回官网</a>
      <button class="btn" id="resetBtn">重置数据</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="toolbar">
      <div class="title">榜单管理（共 <span id="count">0</span> 期）</div>
      <div class="actions">
        <button class="btn" id="sortBtn">排序：倒序 ▼</button>
        <button class="btn btn-primary" id="newBtn">+ 新建榜单</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <table class="table">
      <thead>
        <tr>
          <th>期数</th>
          <th>日期</th>
          <th>歌曲数</th>
          <th class="ops">操作</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </main>

  <!-- 新建 / 编辑弹窗 -->
  <div class="modal-mask" id="mask">
    <div class="modal">
      <h2 id="modalTitle">新建榜单</h2>
      <div class="field-row">
        <div class="field">
          <label>年份</label>
          <input id="fYear" type="number" value="2026">
        </div>
        <div class="field">
          <label>期数</label>
          <input id="fPeriod" type="number" placeholder="如 29">
        </div>
      </div>
      <div class="field">
        <label>日期（可选，默认当天）</label>
        <input id="fDate" type="date">
      </div>
      <div class="field">
        <label>歌曲列表（可用 ↑/↓ 调整排名顺序）</label>
      </div>
      <div id="songEdits"></div>
      <button class="btn add-song" id="addSong">+ 添加歌曲</button>
      <div class="foot">
        <button class="btn" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
